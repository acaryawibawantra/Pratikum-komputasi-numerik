<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Input Metode Secant</title>
</head>
<body>
    <h2>Input Data Metode Secant</h2>
    <form action="#" method="post">
        <label for="persamaan">Persamaan f(x):</label><br>
        <input type="text" id="persamaan" name="persamaan" placeholder="Contoh: x**3 - x - 1" required><br><br>

        <label for="x0">Tebakan awal x0:</label><br>
        <input type="number" id="x0" name="x0" step="any" required><br><br>

        <label for="x1">Tebakan awal x1:</label><br>
        <input type="number" id="x1" name="x1" step="any" required><br><br>

        <label for="tol">Toleransi error:</label><br>
        <input type="number" id="tol" name="tol" step="any" placeholder="Contoh: 0.0001" required><br><br>

        <label for="max_iter">Maksimal iterasi:</label><br>
        <input type="number" id="max_iter" name="max_iter" required><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
